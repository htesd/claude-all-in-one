# 多进程部署:router(对外 API + admin)+ worker0(账号组 + 上游)。
# 两进程共享同一镜像与 SQLite;network_mode host 让 router 经 127.0.0.1 直连 worker,
# 并使 worker 出口走宿主默认路由(egress: direct)。端口在 config/instances.yaml 配置。
#
# 真实 config(system.yaml/instances.yaml/accounts.yaml)与 data/ 由服务器侧提供,不入库。
# 启动:docker compose up -d --build

services:
  router:
    build: .
    image: claude-all-in-one:local
    container_name: caio-router
    command: ["--mode", "router"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      - RUST_LOG=info

  worker0:
    image: claude-all-in-one:exp
    container_name: caio-worker0
    command: ["--mode", "worker", "--instance", "0"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      - router
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      - RUST_LOG=info
      - KIRO_THINKING_IN_HISTORY0=1
      # 旧线缆形态总开关(0.12.155 时代报文形态,见 crates/gw-kiro/src/wire_profile.rs)。
      # 打开 = 整体回退 2026-07-28 之前的上游报文;删掉即恢复 1.0.212 形态。
      # 注意:与 KIRO_THINKING_IN_HISTORY0 同开时,首次切换会让在途会话下一轮缓存 miss 一次。
      # - KIRO_LEGACY_WIRE=1

  # ── dario(Claude OAuth sidecar)独立通道 ────────────────────────────────
  # 与 kiro 通道完全隔离:独立 instances-dario.yaml(router 不跨组路由),独立
  # router-dario(对外 :38992)+ worker-dario(组 DARIO,egress=direct=宿主主 IP)。
  # 二者 front 一个 dario-on-Bun sidecar(报文指纹+BoringSSL TLS+转发到 Anthropic)。
  # DARIO_API_KEY 经 config/dario.env 注入(config/ 不入库、不随 rsync 覆盖)。
  # 出口铁律:OAuth 号出口必须==其登录授权来源 IP。139 登录的 Max 号=direct(主 IP),
  #   严禁套美国代理或复用 kiro 的次 IP。
  dario-sidecar:
    image: oven/bun:1-slim
    container_name: caio-dario-sidecar
    working_dir: /root/dario
    command: ["bun", "dist/cli.js", "proxy", "--port=8788", "--no-live-capture"]
    network_mode: host
    restart: unless-stopped
    volumes:
      - /root/dario:/root/dario
    env_file:
      - ./config/dario.env
    environment:
      - DARIO_INJECTED_ONLY=1
      - DARIO_NO_LIVE_CAPTURE=1
      - DARIO_MAX_BODY_MB=16

  router-dario:
    image: claude-all-in-one:local
    container_name: caio-router-dario
    command: ["--mode", "router", "--instances", "config/instances-dario.yaml"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      - dario-sidecar
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      - RUST_LOG=info

  worker-dario:
    image: claude-all-in-one:local
    container_name: caio-worker-dario
    command: ["--mode", "worker", "--instance", "1", "--instances", "config/instances-dario.yaml"]
    network_mode: host
    restart: unless-stopped
    depends_on:
      - router-dario
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
    environment:
      - RUST_LOG=info
